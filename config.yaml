wechat:
  backend: "macos"
  macos:
    notification_app: "微信"
    search_shortcut: "command+f"

claude:
  chat_model: "claude-sonnet-4-6"
  supervisor_model: "claude-opus-4-6"
  api_key_env: "ANTHROPIC_API_KEY"

user:
  name: "我"

reply_rules:
  private_chat:
    enabled: true
    whitelist_only: true
    max_reply_length: 200
    delay_range: [1, 3]
    history_limit: 20
  group_chat:
    enabled: true
    trigger_mode: "at_me"
    delay_range: [2, 6]
    history_limit: 20
    collect_window: 5
    max_reply_length: 200
  proactive_chat:
    enabled: true

scheduler:
  supervisor_interval: "0 */6 * * *"
  proactive_tasks: []

security:
  rate_limit: 30
  sensitive_words: []
  pause_keyword: "#人工"
  min_delay: 1
